plugins {
    id 'com.android.application'
}

android {
    namespace 'com.droidlogic.setupwizard'
    compileSdk 34

    defaultConfig {
        applicationId "com.droidlogic.setupwizard"
        minSdk 28
        targetSdk 34
        versionCode 1
        versionName "1.0"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    // mockLibs provides AOSP internal libraries (settingslib) for compile-time resolution
    compileOnly project(':mockLibs')
    compileOnly fileTree(dir: 'framework', include: ['*.jar'])

    implementation fileTree(dir: 'libs', include: ['*.aar'])
    implementation fileTree(dir: 'libs', include: ['*.jar'])
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'androidx.leanback:leanback:1.0.0'
    implementation 'com.google.android.material:material:1.9.0'
}
